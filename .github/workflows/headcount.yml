name: 厚生年金の加入者数を記録する（毎月）

# 日本年金機構の適用事業所検索システムは月1回（月初）にデータが更新される。
# 毎月6日 10:41 JST に、企業DBの全社（法人番号あり）の被保険者数を引いて data/headcount/ に残す。
# 過去の月はさかのぼれないので、毎月欠かさず記録しておく。
on:
  schedule:
    - cron: '41 1 6 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 被保険者数を引く
        run: node pipeline/headcount.mjs
      - name: main に保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/headcount
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "データ更新: 厚生年金の加入者数（日本年金機構、自動）"
          git pull --rebase origin main && git push origin HEAD:main

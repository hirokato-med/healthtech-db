name: 医療機器の添付文書を取り直す（毎月）

# 事業データベースの医療機器（PMDA の添付文書検索にある製品）の区分・番号・一般的名称・最新の添付文書を
# 毎月10日 10:23 JST に取り直す。添付文書が改訂された製品は「データの更新」に出す。
on:
  schedule:
    - cron: '23 1 10 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pdftotext を入れる
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: PMDA から取り直す
        run: node pipeline/pmda-devices.mjs --all
      - name: main に保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/services.json data/updates.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "データ更新: 医療機器の添付文書（PMDA、自動）"
          git pull --rebase origin main && git push origin HEAD:main

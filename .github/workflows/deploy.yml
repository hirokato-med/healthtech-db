name: Deploy to GitHub Pages

# main への push、毎朝 9:13 JST（ニュースの取り込み直し）、手動実行で公開する
# 毎朝の実行では、取り込んだニュース・月刊ヘルステック・企業の追加候補を main にコミットして残す
on:
  push:
    branches: [main]
  schedule:
    - cron: '13 0 * * *'
    # 決算発表（15時台に集中）をその日のうちに取り込むため、夜にも実行する（日本時間 19:43）
    - cron: '43 10 * * *'
  workflow_dispatch:

permissions:
  contents: write   # 毎朝取り込んだデータを main に保存するため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ニュースを取り込む（失敗しても公開は続ける）
        run: node pipeline/news.mjs
        continue-on-error: true
      - name: 月刊ヘルステックの新しい回を取り込む（失敗しても公開は続ける）
        run: node pipeline/youtube.mjs
        continue-on-error: true
      - name: 上場企業の適時開示と決算短信の数字を取り込む（TDnet。失敗しても公開は続ける）
        run: node pipeline/tdnet.mjs --days 3
        continue-on-error: true
      - name: 企業の追加候補をまとめる
        run: node pipeline/candidates.mjs
        continue-on-error: true
      - name: 取り込んだデータを main に保存する（毎朝の定期実行と手動実行のみ）
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/monthly.json data/candidates.json data/disclosures.json data/earnings.json data/updates.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "データ更新: ニュース・月刊ヘルステック・適時開示と決算・企業の追加候補（自動）"
          git pull --rebase origin main && git push origin HEAD:main
        continue-on-error: true
      - id: pages
        uses: actions/configure-pages@v5
      - name: ビルド
        run: npm run build
        env:
          # 独自ドメインを設定したら空にする（Settings → Pages → Custom domain）
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
